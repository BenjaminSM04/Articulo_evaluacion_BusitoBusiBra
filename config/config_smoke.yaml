# ============================================================================
# Perfil RÁPIDO para validar el pipeline en CPU con datos sintéticos.
# No usar para experimentos reales (sin pesos preentrenados, pocas épocas).
#   python scripts/00_make_synthetic_data.py --config config/config_smoke.yaml
#   python scripts/02_preprocess.py          --config config/config_smoke.yaml
#   python scripts/03_train_baseline.py --config config/config_smoke.yaml --dataset busi
#   python scripts/04_cross_domain_matrix.py --config config/config_smoke.yaml
# ============================================================================

seed: 42
device: cpu

paths:
  data_raw: data/raw
  data_processed: data/processed
  results: results
  models: results/models
  figures: results/figures
  reports: results/reports

datasets:
  busi:
    name: BUSI
    origin: "Sintético (BUSI-like)"
    raw_dir: data/raw/BUSI
    kaggle_slug: "aryashah2k/breast-ultrasound-images-dataset"
    class_dirs: { benign: benign, malignant: malignant, normal: normal }
  bus_bra:
    name: BUS-BRA
    origin: "Sintético (BUS-BRA-like)"
    raw_dir: data/raw/BUS-BRA
    kaggle_slug: "orvile/bus-bra-a-breast-ultrasound-dataset"
    metadata_csv: bus_data.csv

task:
  classes: [benign, malignant]
  exclude_classes: [normal]
  positive_class: malignant

preprocessing:
  image_size: 96            # pequeño para velocidad
  to_rgb: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  deduplicate: true
  dedup_hash_size: 16
  dedup_max_distance: 5
  crop_annotations: false

augmentation:
  horizontal_flip: 0.5
  rotation_limit: 15
  brightness_contrast: 0.2
  gaussian_noise_var: [10.0, 50.0]
  elastic_transform: false

model:
  architecture: resnet50
  pretrained: false         # no descarga pesos (CI / offline)
  num_classes: 2
  dropout: 0.3

training:
  epochs: 2
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 0
  early_stopping_patience: 5
  early_stopping_metric: auc
  mixed_precision: false
  num_workers: 0            # 0 evita problemas de multiprocessing en Windows/CI
  class_weights: balanced
  label_smoothing: 0.0

cross_validation:
  n_folds: 2
  stratified: true
  group_by_patient: true
  val_fraction: 0.2

evaluation:
  metrics: [accuracy, sensitivity, specificity, auc, f1, balanced_accuracy]
  primary_metric: auc
  bootstrap_ci: true
  n_bootstrap: 100
  ci_level: 0.95

domain_adaptation:
  method: none
  finetune: { freeze_backbone: false, epochs: 2, lr: 0.0005, n_target_labeled: 5 }
  dann: { lambda_grl: 1.0, lambda_schedule: true }
  self_training: { confidence_threshold: 0.9, n_rounds: 1 }

explainability:
  n_samples: 8
  gradcam: { target_layer: auto }
  shap: { background_size: 8, n_eval: 4, max_evals: 200 }
