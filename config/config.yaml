# ============================================================================
# Configuración central del proyecto. ÚNICA fuente de verdad.
# Todos los scripts en scripts/ leen este archivo. Modifica aquí, no en el código.
# ============================================================================

seed: 42
device: cuda            # cuda | cpu  (si no hay GPU, usa cpu)

# ----------------------------------------------------------------------------
# Rutas (relativas a la raíz del proyecto)
# ----------------------------------------------------------------------------
paths:
  data_raw: data/raw
  data_processed: data/processed
  results: results
  models: results/models
  figures: results/figures
  reports: results/reports

# ----------------------------------------------------------------------------
# Datasets
# ----------------------------------------------------------------------------
datasets:
  busi:
    name: BUSI
    origin: "Egipto (El Cairo)"
    raw_dir: data/raw/BUSI
    # Fuente de descarga (Kaggle). Alternativa manual en data/README.md
    kaggle_slug: "aryashah2k/breast-ultrasound-images-dataset"
    class_dirs: { benign: benign, malignant: malignant, normal: normal }
  bus_bra:
    name: BUS-BRA
    origin: "Brasil (Río de Janeiro)"
    raw_dir: data/raw/BUS-BRA
    kaggle_slug: "orvile/bus-bra-a-breast-ultrasound-dataset"
    # BUS-BRA trae metadatos en CSV con etiqueta (Pathology) y BI-RADS
    metadata_csv: bus_data.csv

# ----------------------------------------------------------------------------
# Tarea
# ----------------------------------------------------------------------------
task:
  # Clasificación binaria benigno vs maligno (estándar comparable entre ambos datasets).
  # 'normal' (solo en BUSI) se excluye del experimento principal.
  classes: [benign, malignant]
  exclude_classes: [normal]
  positive_class: malignant     # clase positiva para sensibilidad/especificidad

# ----------------------------------------------------------------------------
# Preprocesamiento
# ----------------------------------------------------------------------------
preprocessing:
  image_size: 224
  to_rgb: true                  # ecografía es escala de grises -> replicar a 3 canales
  # Normalización con estadísticos de ImageNet (modelos preentrenados)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  deduplicate: true             # CRÍTICO en BUSI (≈235 duplicados -> fuga de datos)
  dedup_hash_size: 16
  dedup_max_distance: 5         # distancia de Hamming máx. para considerar duplicado
  crop_annotations: false       # true para recortar texto/marcas si se dispone de máscara

# ----------------------------------------------------------------------------
# Augmentation (solo entrenamiento)
# ----------------------------------------------------------------------------
augmentation:
  horizontal_flip: 0.5
  rotation_limit: 15
  brightness_contrast: 0.2
  gaussian_noise_var: [10.0, 50.0]
  elastic_transform: false
  # NO usar vertical_flip ni recortes agresivos: alteran la semántica clínica.

# ----------------------------------------------------------------------------
# Modelo
# ----------------------------------------------------------------------------
model:
  architecture: resnet50        # resnet50 | efficientnet_b0
  pretrained: true              # pesos ImageNet vía timm
  num_classes: 2
  dropout: 0.3

# ----------------------------------------------------------------------------
# Entrenamiento
# ----------------------------------------------------------------------------
training:
  epochs: 50
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw              # adamw | sgd
  scheduler: cosine             # cosine | plateau | none
  warmup_epochs: 3
  early_stopping_patience: 10
  early_stopping_metric: auc    # métrica de validación a monitorear
  mixed_precision: true         # AMP (recomendado en GPU)
  num_workers: 4
  class_weights: balanced       # balanced | none -> maneja desbalance benigno/maligno
  label_smoothing: 0.0

# ----------------------------------------------------------------------------
# Validación cruzada
# ----------------------------------------------------------------------------
cross_validation:
  n_folds: 5
  stratified: true
  group_by_patient: true        # evita que imágenes del mismo paciente caigan en train y test
  val_fraction: 0.15            # fracción de train para validación/early-stopping

# ----------------------------------------------------------------------------
# Evaluación
# ----------------------------------------------------------------------------
evaluation:
  metrics: [accuracy, sensitivity, specificity, auc, f1, balanced_accuracy]
  primary_metric: auc
  bootstrap_ci: true
  n_bootstrap: 1000
  ci_level: 0.95

# ----------------------------------------------------------------------------
# Adaptación de dominio (para la matriz cross-domain)
# ----------------------------------------------------------------------------
domain_adaptation:
  method: none                  # none | finetune | dann | self_training
  finetune:
    freeze_backbone: false
    epochs: 20
    lr: 0.00005
    n_target_labeled: 0         # 0 = solo source; >0 = few-shot supervisado en target
  dann:
    lambda_grl: 1.0             # peso de la pérdida adversarial (gradient reversal)
    lambda_schedule: true       # programación creciente de lambda (Ganin et al.)
  self_training:
    confidence_threshold: 0.9
    n_rounds: 3

# ----------------------------------------------------------------------------
# Explicabilidad (XAI)
# ----------------------------------------------------------------------------
explainability:
  n_samples: 24                 # nº de casos a explicar (mezcla TP/TN/FP/FN)
  gradcam:
    target_layer: auto          # 'auto' = última capa convolucional del backbone
  shap:
    background_size: 50
    n_eval: 20
    max_evals: 2000
