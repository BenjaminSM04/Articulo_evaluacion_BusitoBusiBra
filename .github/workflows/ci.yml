name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar PyTorch (CPU) y dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Ruff bloqueante en codigo de revision
        run: |
          python -m ruff check --select E4,E7,E9,F \
            src/busi_curation.py src/data/publication_splits.py \
            src/evaluation/publication_protocol.py src/evaluation/publication_statistics.py \
            src/training/publication_protocol.py \
            scripts/10_curate_busi.py scripts/11_run_publication_experiments.py \
            scripts/12_finalize_publication_inference.py scripts/13_analyze_publication_results.py \
            scripts/14_generate_publication_artifacts.py scripts/check_public_scope.py tests

      - name: Verificar inventario publico versionado
        run: python scripts/check_public_scope.py

      - name: Pruebas unitarias sin entrenamiento ni datos clinicos
        run: python -m pytest -q tests
