  - torchvision>=0.16
  - pytorch-cuda=12.1
  - numpy>=1.24
  - pandas>=2.0
  - pillow>=10.0
  - scikit-image>=0.21
  - scikit-learn>=1.3
  - scipy>=1.10
  - matplotlib>=3.7
  - seaborn>=0.13
